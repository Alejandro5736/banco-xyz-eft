server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: bff-web-route
          uri: lb://bff-web
          predicates:
            - Path=/api/v1/web/**
        - id: bff-mobile-route
          uri: lb://bff-mobile
          predicates:
            - Path=/api/v1/mobile/**
        - id: bff-atm-route
          uri: lb://bff-atm
          predicates:
            - Path=/api/v1/atm/**